<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Appareil photo stylisé -->
  <rect x="3" y="9" width="26" height="18" rx="3" fill="#2563eb"/>
  <!-- Flash/viseur en haut -->
  <rect x="11" y="5" width="10" height="4" rx="1" fill="#1d4ed8"/>
  <!-- Objectif extérieur -->
  <circle cx="16" cy="18" r="7" fill="#1d4ed8"/>
  <!-- Objectif intérieur -->
  <circle cx="16" cy="18" r="5" fill="#0f172a"/>
  <!-- Reflet de l'objectif -->
  <circle cx="16" cy="18" r="3" fill="#334155"/>
  <!-- Point de lumière -->
  <circle cx="14" cy="16" r="1.5" fill="#ffffff" opacity="0.6"/>
  <!-- Bouton déclencheur -->
  <rect x="23" y="6" width="4" height="3" rx="1" fill="#f59e0b"/>
</svg>
